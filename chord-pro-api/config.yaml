name: "ProChord API"
description: "ProChord API backend (ASP.NET Core), built from the GitLab container registry."
version: "1.0.0"
slug: "chord_pro_api"
init: false
startup: services
arch:
  - amd64
  - aarch64
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "ProChord API HTTP endpoint"
options:
  gitlab_base_url: "https://gitlab.com/api/v4"
  allowed_origins:
    - "http://127.0.0.1:8085"
    - "http://localhost:4200"
schema:
  gitlab_base_url: str
  allowed_origins:
    - str
